<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleção de E-books Cristãos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 20px auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .combo-card { background: #e8f8f5; border: 2px solid #27ae60; grid-column: 1 / -1; }
        h2 { font-size: 20px; color: #2c3e50; }
        p { color: #666; font-size: 14px; }
        .price { font-size: 22px; font-weight: bold; color: #27ae60; margin: 15px 0; }
        .old-price { text-decoration: line-through; color: #95a5a6; font-size: 16px; margin-right: 10px; }
        .btn { background-color: #2c3e50; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn:hover { background-color: #1a252f; }
        .btn-combo { background-color: #27ae60; font-size: 18px; padding: 15px; font-weight: bold; }
        .btn-combo:hover { background-color: #219150; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Biblioteca Cristã</h1>
    <p>Fortaleça sua fé e transforme sua vida com nossos e-books exclusivos.</p>

    <div id="produtos-container" class="grid"></div>

    <script>
        const produtos = [
            { id: 'ebook-1', titulo: 'O Tesouro que Não Perece', desc: 'Descubra a verdadeira riqueza espiritual.', preco: 29.90 },
            { id: 'ebook-2', titulo: 'Educação dos Filhos', desc: 'Princípios bíblicos para criar seus filhos.', preco: 29.90 },
            { id: 'ebook-3', titulo: 'Paz para a Mente Ansiosa', desc: 'Encontre descanso e conforto em Deus.', preco: 29.90 },
            { id: 'ebook-4', titulo: 'Finanças Segundo a Bíblia', desc: 'Sabedoria financeira à luz da Palavra.', preco: 29.90 },
            { id: 'ebook-5', titulo: 'Libertos das Correntes', desc: 'Um guia prático para a liberdade espiritual.', preco: 29.90 },
            { id: 'ebook-6', titulo: 'Luz na Escuridão', desc: 'Esperança e direção para tempos difíceis.', preco: 29.90 },
            { id: 'ebook-7', titulo: 'Alimentados pela Palavra de Deus', desc: 'Devocional para nutrição diária da fé.', preco: 29.90 },
            { id: 'ebook-8', titulo: 'Casamento Segundo a Bíblia', desc: 'Princípios para uma união duradoura e forte.', preco: 29.90 },
            { id: 'ebook-9', titulo: 'Libertados pelo Poder de Deus', desc: 'Experimente o poder transformador do Evangelho.', preco: 29.90 },
            { id: 'combo-all', titulo: 'Combo Especial: Todos os 9 E-books', desc: 'Leve a coleção completa com um super desconto!', preco: 149.90, precoAntigo: 269.10, isCombo: true }
        ];

        const container = document.getElementById('produtos-container');

        produtos.forEach(prod => {
            const card = document.createElement('div');
            card.className = `card ${prod.isCombo ? 'combo-card' : ''}`;
            
            let priceHTML = prod.precoAntigo 
                ? `<div class="price"><span class="old-price">R$ ${prod.precoAntigo.toFixed(2)}</span> R$ ${prod.preco.toFixed(2)}</div>`
                : `<div class="price">R$ ${prod.preco.toFixed(2)}</div>`;

            card.innerHTML = `
                <div>
                    <h2>${prod.titulo}</h2>
                    <p>${prod.desc}</p>
                </div>
                ${priceHTML}
                <button id="btn-${prod.id}" class="btn ${prod.isCombo ? 'btn-combo' : ''}" onclick="comprar('${prod.id}')">
                    ${prod.isCombo ? 'Comprar Combo' : 'Comprar Agora'}
                </button>
            `;
            container.appendChild(card);
        });

        async function comprar(produtoId) {
            const btn = document.getElementById(`btn-${produtoId}`);
            const textoOriginal = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Processando...";

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtoId })
                });
                
                const data = await response.json();
                
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Erro ao iniciar o pagamento. Tente novamente.");
                    btn.disabled = false;
                    btn.innerText = textoOriginal;
                }
            } catch (error) {
                alert("Ocorreu um erro de conexão.");
                btn.disabled = false;
                btn.innerText = textoOriginal;
            }
        }
    </script>
</body>
</html>
