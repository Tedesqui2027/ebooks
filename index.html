<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Cristã - E-books</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        body { 
            background-color: #f4f7f6; 
            color: #333; 
        }
        header { 
            background: #2c3e50; 
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
        }
        header h1 { 
            font-size: 2.8em; 
            margin-bottom: 15px; 
        }
        header p { 
            font-size: 1.2em; 
            font-weight: 300; 
            color: #bdc3c7;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 50px 20px; 
        }
        .section-title { 
            text-align: center; 
            margin-bottom: 40px; 
            color: #2c3e50; 
            font-size: 2.2em; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 25px; 
            margin-bottom: 50px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border-top: 4px solid #3498db; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .combo-card { 
            border-top: 5px solid #f1c40f; 
            background: #fffdf5; 
            grid-column: 1 / -1; 
            max-width: 800px; 
            margin: 0 auto; 
            text-align: center; 
            box-shadow: 0 8px 20px rgba(241, 196, 15, 0.15);
        }
        .card-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .combo-card .card-img {
            max-width: 400px;
            margin: 0 auto 20px auto;
            display: block;
        }
        .card h2 { 
            font-size: 1.5em; 
            margin-bottom: 15px; 
            color: #2c3e50; 
        }
        .desc { 
            color: #666; 
            margin-bottom: 25px; 
            line-height: 1.6; 
            flex-grow: 1; 
        }
        .price { 
            font-size: 2em; 
            font-weight: bold; 
            color: #27ae60; 
            margin-bottom: 20px; 
        }
        .old-price { 
            font-size: 0.55em; 
            color: #e74c3c; 
            text-decoration: line-through; 
            display: block; 
            font-weight: normal; 
            margin-bottom: 5px; 
        }
        .btn { 
            background: #3498db; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1em; 
            font-weight: bold; 
            transition: background 0.3s; 
            width: 100%; 
        }
        .btn:hover { 
            background: #2980b9; 
        }
        .btn-combo { 
            background: #f39c12; 
            font-size: 1.2em;
            padding: 18px;
        }
        .btn-combo:hover { 
            background: #e67e22; 
        }
        footer { 
            background: #2c3e50; 
            color: white; 
            text-align: center; 
            padding: 30px; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Biblioteca Cristã</h1>
        <p>Transforme sua vida com sabedoria e princípios baseados na Palavra.</p>
    </header>

    <div class="container">
        <h2 class="section-title">Nossos E-books</h2>
        <div id="produtos-container" class="grid"></div>

        <h2 class="section-title" style="margin-top: 40px;">Oferta Especial</h2>
        <div id="combo-container" class="grid"></div>
    </div>

    <footer>
        <p>© 2026 Biblioteca Cristã. Todos os direitos reservados.</p>
    </footer>

    <!-- JANELA FLUTUANTE COM DUPLA CONFIRMAÇÃO DE E-MAIL -->
    <div id="email-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div style="background:white; padding:35px; border-radius:12px; text-align:center; max-width:400px; width:90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="color:#2c3e50; margin-bottom:12px; font-size:1.4em;">Para onde enviamos o E-book?</h3>
            <p style="color:#666; margin-bottom:20px; font-size:15px; line-height: 1.4;">Digite com atenção, pois o material será enviado automaticamente para ele:</p>
            
            <input type="email" id="cliente-email" placeholder="Digite seu melhor e-mail" style="width:100%; padding:14px; margin-bottom:12px; border:1px solid #ccc; border-radius:8px; font-size:16px; outline:none; transition: border-color 0.3s;">
            
            <input type="email" id="cliente-email-confirma" placeholder="Confirme o e-mail digitado acima" style="width:100%; padding:14px; margin-bottom:25px; border:1px solid #ccc; border-radius:8px; font-size:16px; outline:none; transition: border-color 0.3s;">
            
            <button id="btn-confirmar" onclick="confirmarCompra()" style="background:#27ae60; color:white; border:none; padding:16px; border-radius:8px; cursor:pointer; width:100%; font-size:16px; font-weight:bold; transition:0.3s;">Gerar Código Pix</button>
            <button onclick="fecharModal()" style="background:transparent; color:#95a5a6; border:none; margin-top:20px; cursor:pointer; font-size:15px; text-decoration:underline;">Cancelar compra</button>
        </div>
    </div>

    <script>
        // CATÁLOGO DE PRODUTOS
        const produtosAvulsos = [
            { id: 'ebook-1', titulo: 'O Tesouro que Não Perece', desc: 'Descubra a verdadeira riqueza espiritual e valores eternos.', preco: 29.90, imagem: 'img/ebook-1.jpg' },
            { id: 'ebook-2', titulo: 'Educação dos Filhos', desc: 'Princípios bíblicos práticos para a criação da sua família.', preco: 29.90, imagem: 'img/ebook-2.jpg' },
            { id: 'ebook-3', titulo: 'Paz para a Mente Ansiosa', desc: 'Encontre descanso e conforto em Deus para os dias agitados.', preco: 29.90, imagem: 'img/ebook-3.jpg' },
            { id: 'ebook-4', titulo: 'Finanças Segundo a Bíblia', desc: 'Sabedoria financeira à luz da Palavra para uma vida próspera.', preco: 29.90, imagem: 'img/ebook-4.jpg' },
            { id: 'ebook-5', titulo: 'Libertos das Correntes', desc: 'Um guia prático para alcançar a verdadeira liberdade espiritual.', preco: 29.90, imagem: 'img/ebook-5.jpg' },
            { id: 'ebook-6', titulo: 'Luz na Escuridão', desc: 'Esperança, fé e direção divina para superar tempos difíceis.', preco: 29.90, imagem: 'img/ebook-6.jpg' },
            { id: 'ebook-7', titulo: 'Alimentados pela Palavra', desc: 'Devocional diário para nutrição e fortalecimento da sua fé.', preco: 29.90, imagem: 'img/ebook-7.jpg' },
            { id: 'ebook-8', titulo: 'Casamento Segundo a Bíblia', desc: 'Princípios sagrados para construir uma união duradoura e forte.', preco: 29.90, imagem: 'img/ebook-8.jpg' },
            { id: 'ebook-9', titulo: 'Libertados pelo Poder', desc: 'Experimente o agir transformador do Evangelho na sua vida.', preco: 29.90, imagem: 'img/ebook-9.jpg' }
        ];

        const combo = { id: 'combo-all', titulo: 'Coleção Completa: Os 9 E-books', desc: 'Leve toda a nossa biblioteca de sabedoria cristã de uma só vez e garanta um super desconto exclusivo.', preco: 149.90, precoAntigo: 269.10, imagem: 'img/combo.jpg', isCombo: true };

        // FUNÇÃO DE RENDERIZAÇÃO
        function renderizarProduto(prod, container) {
            const card = document.createElement('div');
            card.className = `card ${prod.isCombo ? 'combo-card' : ''}`;
            
            let priceHTML = prod.precoAntigo 
                ? `<div class="price"><span class="old-price">R$ ${prod.precoAntigo.toFixed(2)}</span> R$ ${prod.preco.toFixed(2)}</div>`
                : `<div class="price">R$ ${prod.preco.toFixed(2)}</div>`;

            card.innerHTML = `
                <img src="${prod.imagem}" alt="${prod.titulo}" class="card-img" onerror="this.style.display='none'">
                <div>
                    <h2>${prod.titulo}</h2>
                    <p class="desc">${prod.desc}</p>
                </div>
                ${priceHTML}
                <button class="btn ${prod.isCombo ? 'btn-combo' : ''}" onclick="abrirModal('${prod.id}')">
                    ${prod.isCombo ? 'Garantir Combo Completo' : 'Comprar Agora'}
                </button>
            `;
            document.getElementById(container).appendChild(card);
        }

        produtosAvulsos.forEach(prod => renderizarProduto(prod, 'produtos-container'));
        renderizarProduto(combo, 'combo-container');

        // LÓGICA DO MODAL
        let produtoSelecionadoId = null;

        function abrirModal(produtoId) {
            produtoSelecionadoId = produtoId;
            document.getElementById('email-modal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('email-modal').style.display = 'none';
            document.getElementById('cliente-email').value = ''; 
            document.getElementById('cliente-email-confirma').value = ''; 
        }

        // COMUNICAÇÃO COM O BACKEND
        async function confirmarCompra() {
            const email = document.getElementById('cliente-email').value;
            const confirma = document.getElementById('cliente-email-confirma').value;
            
            // Verifica se está vazio e se os e-mails são iguais
            if (!email || !email.includes('@')) {
                alert("Por favor, digite um e-mail válido.");
                return;
            }
            if (email !== confirma) {
                alert("Os e-mails digitados não são iguais. Por favor, corrija para não perder seu e-book.");
                return;
            }

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;
            btn.innerText = "Processando conexão segura...";

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtoId: produtoSelecionadoId, email: email })
                });
                
                const data = await response.json();
                
                if (data.url) {
                    window.location.href = data.url; 
                } else {
                    alert("MOTIVO DA RECUSA DO MERCADO PAGO:\n\n" + JSON.stringify(data, null, 2));
                    btn.disabled = false;
                    btn.innerText = "Gerar Código Pix";
                }
            } catch (error) {
                alert("Ocorreu um erro de rede: " + error.message);
                btn.disabled = false;
                btn.innerText = "Gerar Código Pix";
            }
        }

        // DESTRAVA O BOTÃO SE O USUÁRIO CLICAR EM "VOLTAR" NO NAVEGADOR
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                const btn = document.getElementById('btn-confirmar');
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Gerar Código Pix";
                }
            }
        });
    </script>
</body>
</html>
