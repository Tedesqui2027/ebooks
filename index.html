<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleção de E-books Cristãos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; }
        
        /* Capa Principal */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?auto=format&fit=crop&w=1920&q=80') center/cover;
            color: white; text-align: center; padding: 120px 20px;
        }
        .hero h1 { font-size: 3em; margin-bottom: 15px; }
        .hero p { font-size: 1.2em; max-width: 600px; margin: 0 auto; color: #e0e0e0; line-height: 1.6; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 40px; color: #2c3e50; font-size: 2.2em; }
        
        /* Banner de respiro visual */
        .banner-img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin: 40px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Grid dos Livros */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border-top: 4px solid transparent; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-top: 4px solid #3498db; }
        
        /* Destaque para o Combo */
        .combo-card { background: #f0fbf6; border: 2px solid #27ae60; grid-column: 1 / -1; align-items: center; text-align: center; }
        .combo-card:hover { border-top: 2px solid #27ae60; }
        
        h2 { font-size: 20px; color: #2c3e50; margin-bottom: 10px; }
        p.desc { color: #666; font-size: 15px; line-height: 1.5; }
        .price { font-size: 24px; font-weight: bold; color: #27ae60; margin: 20px 0; }
        .old-price { text-decoration: line-through; color: #95a5a6; font-size: 16px; margin-right: 10px; }
        
        /* Botões */
        .btn { background-color: #2c3e50; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; }
        .btn:hover { background-color: #1a252f; }
        .btn-combo { background-color: #27ae60; font-size: 18px; max-width: 400px; margin: 0 auto; }
        .btn-combo:hover { background-color: #219150; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        /* Rodapé */
        footer { background-color: #2c3e50; color: white; text-align: center; padding: 30px; margin-top: 60px; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Alimento para a Alma</h1>
        <p>Encontre direção, paz e sabedoria através da nossa coleção de obras inspiradas na Palavra. Transforme sua jornada diária com leituras que edificam.</p>
    </header>

    <div class="container">
        <h2 class="section-title">Nossa Biblioteca</h2>
        
        <div id="produtos-container" class="grid"></div>

        <img src="https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=1200&q=80" alt="Luz do sol e paz" class="banner-img">

        <h2 class="section-title" style="margin-top: 20px;">Oferta Especial</h2>
        <div id="combo-container" class="grid"></div>
    </div>

    <footer>
        <p>© 2026 Biblioteca Cristã. Todos os direitos reservados.</p>
    </footer>

    <script>
        const produtosAvulsos = [
            { id: 'ebook-1', titulo: 'O Tesouro que Não Perece', desc: 'Descubra a verdadeira riqueza espiritual e valores eternos.', preco: 29.90 },
            { id: 'ebook-2', titulo: 'Educação dos Filhos', desc: 'Princípios bíblicos práticos para a criação da sua família.', preco: 29.90 },
            { id: 'ebook-3', titulo: 'Paz para a Mente Ansiosa', desc: 'Encontre descanso e conforto em Deus para os dias agitados.', preco: 29.90 },
            { id: 'ebook-4', titulo: 'Finanças Segundo a Bíblia', desc: 'Sabedoria financeira à luz da Palavra para uma vida próspera.', preco: 29.90 },
            { id: 'ebook-5', titulo: 'Libertos das Correntes', desc: 'Um guia prático para alcançar a verdadeira liberdade espiritual.', preco: 29.90 },
            { id: 'ebook-6', titulo: 'Luz na Escuridão', desc: 'Esperança, fé e direção divina para superar tempos difíceis.', preco: 29.90 },
            { id: 'ebook-7', titulo: 'Alimentados pela Palavra', desc: 'Devocional diário para nutrição e fortalecimento da sua fé.', preco: 29.90 },
            { id: 'ebook-8', titulo: 'Casamento Segundo a Bíblia', desc: 'Princípios sagrados para construir uma união duradoura e forte.', preco: 29.90 },
            { id: 'ebook-9', titulo: 'Libertados pelo Poder', desc: 'Experimente o agir transformador do Evangelho na sua vida.', preco: 29.90 }
        ];

        const combo = { id: 'combo-all', titulo: 'Coleção Completa: Os 9 E-books', desc: 'Leve toda a nossa biblioteca de sabedoria cristã de uma só vez e garanta um super desconto exclusivo.', preco: 149.90, precoAntigo: 269.10, isCombo: true };

        function renderizarProduto(prod, container) {
            const card = document.createElement('div');
            card.className = `card ${prod.isCombo ? 'combo-card' : ''}`;
            
            let priceHTML = prod.precoAntigo 
                ? `<div class="price"><span class="old-price">R$ ${prod.precoAntigo.toFixed(2)}</span> R$ ${prod.preco.toFixed(2)}</div>`
                : `<div class="price">R$ ${prod.preco.toFixed(2)}</div>`;

            card.innerHTML = `
                <div>
                    <h2>${prod.titulo}</h2>
                    <p class="desc">${prod.desc}</p>
                </div>
                ${priceHTML}
                <button id="btn-${prod.id}" class="btn ${prod.isCombo ? 'btn-combo' : ''}" onclick="comprar('${prod.id}')">
                    ${prod.isCombo ? 'Garantir Combo Completo' : 'Comprar Agora'}
                </button>
            `;
            document.getElementById(container).appendChild(card);
        }

        produtosAvulsos.forEach(prod => renderizarProduto(prod, 'produtos-container'));
        renderizarProduto(combo, 'combo-container');

        async function comprar(produtoId) {
            const btn = document.getElementById(`btn-${produtoId}`);
            const textoOriginal = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Processando pagamento...";

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtoId })
                });
                
                const data = await response.json();
                
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Erro ao iniciar o pagamento. Tente novamente.");
                    btn.disabled = false;
                    btn.innerText = textoOriginal;
                }
            } catch (error) {
                alert("Ocorreu um erro de conexão.");
                btn.disabled = false;
                btn.innerText = textoOriginal;
            }
        }

        // DESTRAVA OS BOTÕES CASO O USUÁRIO CLIQUE EM "VOLTAR" NO NAVEGADOR
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                document.querySelectorAll('.btn').forEach(btn => {
                    btn.disabled = false;
                    btn.innerText = btn.classList.contains('btn-combo') ? "Garantir Combo Completo" : "Comprar Agora!";
                });
            }
        });
    </script>
</body>
</html>
