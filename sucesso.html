<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Liberado!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: url('https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?auto=format&fit=crop&w=1920&q=80') center/cover; padding: 50px 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(255, 255, 255, 0.95); max-width: 500px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #27ae60; margin-bottom: 15px; }
        p { font-size: 18px; color: #555; line-height: 1.5; }
        #status-msg { font-weight: bold; margin-top: 25px; color: #e67e22; font-size: 1.1em; }
        .btn-download { display: none; background-color: #27ae60; color: white; text-decoration: none; padding: 15px 30px; border-radius: 8px; margin-top: 25px; font-weight: bold; font-size: 1.1em; }
        .btn-download:hover { background-color: #219150; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Obrigado pela sua compra!</h1>
        <p>A paz esteja com você. Estamos validando o seu pagamento e liberando o material escolhido.</p>
        <div id="status-msg">Aguarde um momento... verificando nosso sistema.</div>
        <a id="btn-manual" class="btn-download" href="#" target="_blank">Acessar Meu Material</a>
    </div>

    <script>
        async function liberarDownload() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('payment_id');
            const statusMsg = document.getElementById('status-msg');
            const btnManual = document.getElementById('btn-manual');

            if (!paymentId) {
                statusMsg.innerText = "Nenhum pagamento identificado nesta sessão.";
                statusMsg.style.color = "#c0392b";
                return;
            }

            try {
                const response = await fetch(`/api/download?payment_id=${paymentId}`);
                const data = await response.json();

                if (data.status === 'approved') {
                    statusMsg.innerText = "Pagamento aprovado! Seu link seguro foi gerado.";
                    statusMsg.style.color = "#27ae60";
                    btnManual.style.display = "inline-block";
                    btnManual.href = data.url;
                    window.location.href = data.url;
                } else if (data.status === 'pending' || data.status === 'in_process') {
                    statusMsg.innerText = "Pagamento pendente. Se foi via Pix, pode levar até 1 minuto. Atualize a página.";
                } else {
                    statusMsg.innerText = data.error || "Acesso expirado. Verifique seu e-mail.";
                    statusMsg.style.color = "#c0392b";
                }
            } catch (error) {
                statusMsg.innerText = "Erro ao conectar com o servidor.";
                statusMsg.style.color = "#c0392b";
            }
        }
        window.onload = liberarDownload;
    </script>
</body>
</html>
