<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 50px; text-align: center; color: #333; }
        .box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #27ae60; }
        p { font-size: 18px; color: #555; }
        #status-msg { font-weight: bold; margin-top: 20px; color: #e67e22; }
        .btn-download { display: none; background-color: #2c3e50; color: white; text-decoration: none; padding: 15px 20px; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        .btn-download:hover { background-color: #1a252f; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Obrigado pela sua compra!</h1>
        <p>Estamos validando o seu pagamento e liberando o seu material.</p>
        <div id="status-msg">Aguarde um momento... verificando o sistema.</div>
        <a id="btn-manual" class="btn-download" href="#" target="_blank">Clique aqui para baixar agora</a>
    </div>

    <script>
        async function liberarDownload() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('payment_id');
            const statusMsg = document.getElementById('status-msg');
            const btnManual = document.getElementById('btn-manual');

            if (!paymentId) {
                statusMsg.innerText = "Nenhum pagamento identificado nesta sessão.";
                statusMsg.style.color = "red";
                return;
            }

            try {
                const response = await fetch(`/api/download?payment_id=${paymentId}`);
                const data = await response.json();

                if (data.status === 'approved') {
                    statusMsg.innerText = "Pagamento aprovado! Seu link de download foi gerado.";
                    statusMsg.style.color = "green";
                    
                    btnManual.style.display = "inline-block";
                    btnManual.href = data.url;

                    // Tenta iniciar o download automaticamente
                    window.location.href = data.url;
                } else if (data.status === 'pending' || data.status === 'in_process') {
                    statusMsg.innerText = "Seu pagamento ainda está processando. Atualize a página em alguns minutos.";
                } else {
                    statusMsg.innerText = data.error || "Acesso negado ou link expirado.";
                    statusMsg.style.color = "red";
                }
            } catch (error) {
                statusMsg.innerText = "Erro ao conectar com o servidor.";
                statusMsg.style.color = "red";
            }
        }

        window.onload = liberarDownload;
    </script>
</body>
</html>
